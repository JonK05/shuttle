<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuttle Pro - Order History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styling.css">
    <link href="styling2.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16 font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📋</span>
                <h1 class="text-xl font-bold tracking-wide text-emerald-400">Order History</h1>
            </div>
            <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full text-slate-200 font-medium transition flex items-center space-x-1">
                <span>←</span>
                <span>Back to Store</span>
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold text-slate-200">Submitted Orders</h2>
            <button onclick="clearOrders()" class="text-xs text-rose-400 hover:text-rose-300 bg-rose-950/40 hover:bg-rose-900/40 border border-rose-800/60 px-3 py-1 rounded-lg transition">
                Clear History
            </button>
        </div>

        <!-- Orders Container -->
        <div id="ordersList" class="space-y-4">
            <!-- Dynamically populated -->
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        function loadOrders() {
            const container = document.getElementById('ordersList');
            // Fetching orders from localStorage (you'll need to save them here on checkout)
            const orders = JSON.parse(localStorage.getItem('shuttle_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-10 text-center space-y-3">
                        <div class="text-4xl">🛒</div>
                        <h3 class="text-base font-bold text-white">No orders found</h3>
                        <p class="text-xs text-slate-400">Orders placed from the store will appear here.</p>
                        <div>
                            <a href="index.html" class="inline-block mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
                                Start Shopping
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map((order, index) => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3 shadow-sm">
                    <div class="flex justify-between items-start border-b border-slate-700/60 pb-3">
                        <div>
                            <span class="text-xs font-semibold bg-emerald-900/60 text-emerald-300 px-2 py-0.5 rounded">Order #${orders.length - index}</span>
                            <h3 class="font-bold text-base text-white mt-1">${order.name}</h3>
                            <p class="text-xs text-slate-400">Phone: ${order.phone} | Referral: ${order.refCode || 'None'}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-emerald-400 font-bold text-lg">RM${order.totalPrice.toFixed(2)}</span>
                            <p class="text-[11px] text-slate-400">${order.date}</p>
                        </div>
                    </div>
                    <div class="text-xs space-y-1 text-slate-300">
                        <p class="font-semibold text-slate-400">Items:</p>
                        <ul class="list-disc list-inside space-y-0.5 text-slate-300 pl-1">
                            ${order.items.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-700/60 text-xs">
                        <span class="bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-300">🚚 ${order.fulfillment}</span>
                        <span class="bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-300">💳 ${order.payment}</span>
                    </div>
                </div>
            `).join('');
        }

        function clearOrders() {
            if (confirm('Are you sure you want to clear all order history?')) {
                localStorage.removeItem('shuttle_orders');
                loadOrders();
            }
        }

        // Load orders on page load
        window.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
